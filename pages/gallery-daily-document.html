<!doctype html>
<html lang="en">
  <head>
    <script src="../js/app-entry.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daily Internship Document | OJT Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/Home.css" />
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/gallery.css" />
      <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/skeleton.css" />
    <script src="../js/skeleton.js"></script>
    <script src="../js/pdf-export.js" defer></script>
    <script src="../js/docx-export.js" defer></script>
    <script src="../js/daily-photos.js" defer></script>
    <script src="../js/daily-document.js" defer></script>
    <link rel="stylesheet" href="../css/desktop.css" />
    <link rel="stylesheet" href="../css/photo-document.css" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#234e7a" />
    <script src="../js/offline.js" defer></script>
</head>
  <body class="app-shell">
    <div class="device">
      <header class="gallery-header"><h1>Gallery</h1></header>
      <main class="gallery-main">
        <nav class="gallery-subnav" aria-label="Gallery sections">
          <a href="./gallery.html" aria-current="page">Daily Internship</a>
          <a href="./gallery-personal.html">Personal Photos</a>
          <a href="./gallery-upload.html">Upload Photos</a>
          <a href="./gallery-document.html">Document Preview</a>
        </nav>
        <div class="gallery-section-intro">
          <div>
            <h2>Daily internship document</h2>
            <p>Photos from daily internship reports, organized by date and day.</p>
          </div>
          <a class="gallery-button" href="./report.html">Open daily report</a>
        </div>
        <section class="gallery-toolbar document-actions" aria-label="Document exports">
          <div class="gallery-actions">
            <button class="gallery-button" type="button" data-daily-action="layout">Paper size</button>
            <button class="gallery-button" type="button" data-daily-action="print" disabled>Print</button>
            <button class="gallery-button" type="button" data-daily-action="docx" disabled>Download Word (.docx)</button>
            <button class="gallery-button primary" type="button" data-daily-action="pdf" disabled>Download PDF</button>
          </div>
          
        </section>
        <article class="internship-document personal-document" aria-label="Internship photo document">

          <div data-daily-photos="document"></div>
</article>
      </main>
      <nav class="tab-bar" aria-label="Primary">
        <a class="tab-btn" href="../Home.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11l9-7 9 7" />
            <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
          </svg>
          <span>Home</span>
        </a>
        <a class="tab-btn active" href="./gallery.html" aria-current="page">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <circle cx="8" cy="8" r="1.5" />
            <path d="m3 17 6-6 4 4 3-3 5 5" />
          </svg>
          <span>Gallery</span>
        </a>
        <a class="tab-btn" href="./report.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3h7l4 4v14H7z" />
            <path d="M14 3v4h4" />
          </svg>
          <span>Report</span>
        </a>
        <a class="tab-btn" href="./profile.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="3.2" />
            <path d="M5 20c1.2-3.6 4-5.5 7-5.5S17.8 16.4 19 20" />
          </svg>
          <span>Profile</span>
        </a>
      </nav>
    </div>
  <script src="../js/profile-identity.js"></script>
<dialog id="document-options" aria-labelledby="document-options-title">
      <form>
        <h2 id="document-options-title">Document settings</h2>
        <label for="paper-size">Paper size</label>
        <select id="paper-size" name="paper">
          <option value="a4">A4 (210 × 297 mm)</option>
          <option value="letter">Letter (8.5 × 11 in)</option>
          <option value="legal">Legal (8.5 × 14 in)</option>
        </select>
        <div data-export-hint hidden>
          <label for="pdf-filename">Filename</label>
          <input id="pdf-filename" name="filename" type="text" maxlength="100" value="Daily-Internship-Photos" />
          <p>The file extension is added automatically.</p>
        </div>
        <p data-document-error role="alert"></p>
        <div class="document-modal-actions">
          <button type="button" class="gallery-button" data-cancel-document>Cancel</button>
          <button type="submit" class="gallery-button primary" data-confirm-document>Apply layout</button>
        </div>
      </form>
    </dialog>
</body>
</html>
